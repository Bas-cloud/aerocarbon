<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonPro | Fietsaccessoires</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">CarbonPro.</div>
        <div class="nav-links">
            <a href="#producten">Producten</a>
            <a href="#support">Support</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Licht. Snel. Adembenemend.</h1>
        <p>De ultieme carbon upgrades voor jouw rit.</p>
        <a href="#producten" class="btn-primary">Bekijk collectie</a>
    </header>

    <section id="producten" class="products">
        <div class="card">
            <h3>Aero Stuur</h3>
            <p>Maximale aerodynamica.</p>
            <span class="price">€ 249</span>
            <a href="#" class="btn-buy">Koop</a>
        </div>
        
        <div class="card">
            <img src="carbon_houder_1.png" alt="Carbon Bidonhouder" style="width: 100%; border-radius: 12px; margin-bottom: 15px;">
            <h3>Carbon Bidonhouder</h3>
            <p>Slechts 17 gram. Maximale grip.</p>
            <span class="price">€ 39</span>
            <a href="#" class="btn-buy">Koop</a>
        </div>

        <div class="card">
            <h3>Pro Zadelpen</h3>
            <p>Comfort ontmoet stijfheid.</p>
            <span class="price">€ 129</span>
            <a href="#" class="btn-buy">Koop</a>
        </div>
    </section>
</body>
</html>
