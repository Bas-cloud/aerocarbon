<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonPro | Fietsaccessoires</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">CarbonPro.</div>
    </nav>

    <header class="hero">
        <h1>Licht. Snel. Adembenemend.</h1>
        <p>De ultieme carbon upgrades voor jouw rit.</p>
    </header>

    <section class="products">
        <!-- Categorie 1 -->
        <div class="card">
            <img src="cat_bidon.png" alt="Bidonhouders" style="width: 100%; border-radius: 12px; margin-bottom: 15px; background: #eee; aspect-ratio: 1/1;">
            <h3>Bidonhouders</h3>
            <span class="price">Vanaf € 39</span>
            <br><br>
            <a href="bidonhouders.html" class="btn-primary">Bekijk collectie</a>
        </div>

        <!-- Categorie 2 -->
        <div class="card">
            <img src="cat_computer.png" alt="Computerhouders" style="width: 100%; border-radius: 12px; margin-bottom: 15px; background: #eee; aspect-ratio: 1/1;">
            <h3>Computerhouders</h3>
            <span class="price">Vanaf € 29</span>
            <br><br>
            <a href="computerhouders.html" class="btn-primary">Bekijk collectie</a>
        </div>

        <!-- Categorie 3 -->
        <div class="card">
            <img src="cat_stuur.png" alt="Sturen" style="width: 100%; border-radius: 12px; margin-bottom: 15px; background: #eee; aspect-ratio: 1/1;">
            <h3>Sturen & Cockpits</h3>
            <span class="price">Vanaf € 249</span>
            <br><br>
            <a href="sturen.html" class="btn-primary">Bekijk collectie</a>
        </div>
    </section>
</body>
</html>
