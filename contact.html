<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | CarbonPro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">CarbonPro.</a></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="over-ons.html">Over ons</a>
            <a href="contact.html" style="color: var(--accent-color);">Contact</a>
        </div>
    </nav>

    <header class="hero" style="padding: 60px 20px 40px 20px;">
        <h1>Neem contact op.</h1>
        <p>Vragen over een product of advies nodig? Wij staan voor je klaar.</p>
    </header>

    <section class="products" style="padding-top: 20px;">
        <div style="max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-soft); text-align: left;">
            
            <form action="mailto:info@carbonpro.nl" method="POST" enctype="text/plain">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Jouw Naam</label>
                    <input type="text" name="naam" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">E-mailadres</label>
                    <input type="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Bericht</label>
                    <textarea name="bericht" rows="5" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box;"></textarea>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Verstuur Bericht</button>
            </form>

        </div>
    </section>

    <footer style="text-align: center; padding: 40px; color: var(--text-secondary); font-size: 0.9rem;">
        <p>&copy; 2026 CarbonPro. Alle rechten voorbehouden.</p>
    </footer>
</body>
</html>
